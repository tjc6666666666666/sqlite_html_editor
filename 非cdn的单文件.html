<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>SQLite可视化编辑器（Excel式）</title>
  <!-- 引入依赖库（移除了Tabledit） -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <!-- 引入CodeMirror用于SQL语法高亮 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/sql/sql.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: "微软雅黑", Arial, sans-serif;
    }
    body {
      margin: 20px;
    }
    /* 拖放/选择文件区域样式 */
    .drop-area {
      border: 2px dashed #007bff;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      font-size: 18px;
      color: #666;
      margin-bottom: 20px;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }
    .drop-area.highlight {
      border-color: #28a745;
      background-color: #f8fff9;
    }
    /* 隐藏的文件选择输入框 */
    #fileInput {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    /* 表列表样式 */
    .table-panel {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .table-list {
      flex-shrink: 0;
      width: 200px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
    }
    .table-list h4 {
      margin: 0 0 10px 0;
      color: #333;
    }
    .table-list .table-item {
      display: flex;
      gap: 5px;
      margin-bottom: 5px;
    }
    .table-list .table-name-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background-color: #f8f9fa;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      transition: background-color 0.2s;
    }
    .table-list .table-name-btn:hover {
      background-color: #e2e6ea;
    }
    .table-list .delete-btn {
      padding: 8px 10px;
      border: none;
      background-color: #dc3545;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .table-list .delete-btn:hover {
      background-color: #c82333;
    }
    .add-table-btn {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      border: none;
      background-color: #28a745;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .add-table-btn:hover {
      background-color: #218838;
    }
    /* 数据表格样式 */
    .data-area {
      flex-grow: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .action-buttons button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
      white-space: nowrap;
      height: 38px;
      line-height: 22px;
      font-size: 14px;
    }
    .action-buttons #exportBtn {
      background-color: #007bff;
      height: 38px;
      margin: 0;
    }
    .action-buttons #exportBtn:hover {
      background-color: #0056b3;
    }
    .action-buttons .column-manager-btn {
      background-color: #17a2b8;
    }
    .action-buttons .column-manager-btn:hover {
      background-color: #138496;
    }
    .action-buttons .add-column-btn {
      background-color: #fd7e14;
    }
    .action-buttons .add-column-btn:hover {
      background-color: #e36a09;
    }
    .action-buttons .add-row-btn {
      background-color: #28a745;
    }
    .action-buttons .add-row-btn:hover {
      background-color: #218838;
    }
    .action-buttons .delete-row-btn {
      background-color: #dc3545;
    }
    .action-buttons .delete-row-btn:hover {
      background-color: #c82333;
    }
    /* 复选框列样式 */
    .row-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .row-checkbox-header {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    /* 行数据输入样式 */
    .row-data-input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    .row-data-input:focus {
      outline: none;
      border-color: #007bff;
    }
    .row-data-input-label {
      font-weight: bold;
      margin-bottom: 5px;
      display: block;
    }
    .row-data-label-pk {
      color: #ffc107;
      font-weight: bold;
    }
    .row-data-label-notnull {
      color: #dc3545;
    }
    /* 加载提示样式 */
    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
    /* 编辑单元格样式 */
    td.editable {
      cursor: pointer;
    }
    td.editable:hover {
      background-color: #f5f9ff;
    }
    .edit-input {
      width: 100%;
      border: 1px solid #007bff;
      padding: 4px;
      box-sizing: border-box;
      outline: none;
    }
    /* 模态框样式 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h3 {
      margin: 0;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #666;
    }
    .close-btn:hover {
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .column-definition {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .column-definition .column-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .column-definition .column-row input {
      flex: 1;
    }
    .column-definition .column-row select {
      flex: 1;
    }
    .column-list {
      margin-bottom: 10px;
    }
    .modal-footer {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .modal-footer button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #545b62;
    }
    .btn-small {
      padding: 5px 10px;
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-add {
      background-color: #28a745;
      color: white;
      padding: 8px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-add:hover {
      background-color: #218838;
    }
    /* 列选择样式 */
    .column-select-list {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      max-height: 300px;
      overflow-y: auto;
    }
    .column-select-item {
      display: flex;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid #eee;
    }
    .column-select-item:last-child {
      border-bottom: none;
    }
    .column-select-item label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      flex: 1;
    }
    .column-select-item.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .column-select-item .pk-badge {
      background-color: #ffc107;
      color: #333;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    /* SQL执行区域样式 */
    .sql-exec-area {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0;
      margin-bottom: 20px;
      background-color: #f8f9fa;
    }
    .sql-exec-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      cursor: pointer;
      border-bottom: 1px solid #ddd;
      background-color: #f0f0f0;
      transition: background-color 0.2s;
    }
    .sql-exec-header:hover {
      background-color: #e8e8e8;
    }
    .sql-exec-header h3 {
      margin: 0;
      color: #333;
      font-size: 16px;
    }
    .sql-exec-header .toggle-icon {
      font-size: 20px;
      font-weight: bold;
      color: #666;
      transition: transform 0.3s;
    }
    .sql-exec-header.collapsed .toggle-icon {
      transform: rotate(-90deg);
    }
    .sql-exec-content {
      padding: 15px;
      overflow: hidden;
      transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
      max-height: 2000px;
      opacity: 1;
    }
    .sql-exec-content.hidden {
      max-height: 0;
      padding: 0 15px;
      opacity: 0;
    }
    .CodeMirror {
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      height: auto;
      min-height: 120px;
      max-height: 400px;
    }
    .CodeMirror-scroll {
      min-height: 120px;
      max-height: 400px;
    }
    .sql-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .sql-actions button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
      white-space: nowrap;
    }
    .sql-actions button:hover {
      opacity: 0.9;
    }
    #sqlResultArea {
      margin-top: 15px;
    }
    #sqlResultTable {
      overflow-x: auto;
    }
    #sqlResultTable table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }
    #sqlResultTable table th,
    #sqlResultTable table td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      font-size: 13px;
    }
    #sqlResultTable table th {
      background-color: #f0f0f0;
      font-weight: bold;
    }
    #sqlResultTable table tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .sql-message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
    }
    .sql-message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .sql-message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .sql-message.info {
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    .sql-stats {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <!-- 拖放/选择文件区域 -->
  <div id="dropArea" class="drop-area">
    将SQLite文件拖放至此处，或点击选择文件（如user.db）
    <!-- 隐藏的文件选择输入框 -->
    <input type="file" id="fileInput" accept=".db,.sqlite,.sqlite3" />
  </div>

  <!-- SQL执行区域 -->
  <div class="sql-exec-area">
    <div class="sql-exec-header" id="sqlExecHeader">
      <h3>SQL执行区域（高级功能）</h3>
      <span class="toggle-icon">▼</span>
    </div>
    <div class="sql-exec-content hidden" id="sqlExecContent">
      <textarea id="sqlInput" rows="5" placeholder="在此输入SQL语句...&#10;例如：SELECT * FROM table_name WHERE condition;&#10;支持 SELECT、INSERT、UPDATE、DELETE 等SQL语句"></textarea>
      <div class="sql-actions">
        <button id="executeSqlBtn" style="background-color: #17a2b8;">执行SQL</button>
        <button id="clearSqlBtn" style="background-color: #6c757d;">清空</button>
      </div>
      <div id="sqlResultArea">
        <div id="sqlResultTable"></div>
        <div id="sqlMessage" class="sql-message"></div>
      </div>
    </div>
  </div>

  <!-- 表列表 + 数据区域 -->
  <div class="table-panel">
    <div class="table-list">
      <h4>数据库表</h4>
      <div id="tableList"></div>
      <button class="add-table-btn" id="addTableBtn">+ 新增表</button>
    </div>
    <div class="data-area">
      <div class="action-buttons">
        <button id="exportBtn" style="display: none;">导出修改后的SQLite文件</button>
        <button class="column-manager-btn" id="deleteColumnBtn" style="display: none;">- 删除列</button>
        <button class="add-column-btn" id="addColumnBtn" style="display: none;">+ 添加列</button>
        <button class="add-row-btn" id="addRowBtn" style="display: none;">+ 添加行</button>
        <button class="delete-row-btn" id="deleteRowBtn" style="display: none;">- 删除选中行</button>
      </div>
      <table id="dataTable" class="display" style="width:100%"></table>
    </div>
  </div>

  <!-- 创建表模态框 -->
  <div class="modal-overlay" id="createTableModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>创建新表</h3>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="tableName">表名</label>
          <input type="text" id="tableName" placeholder="请输入表名">
        </div>
        <div class="form-group">
          <label>列定义</label>
          <div class="column-list" id="columnList"></div>
          <button class="btn-add" id="addColumnDefBtn">+ 添加列</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelBtn">取消</button>
        <button class="btn-primary" id="saveTableBtn">创建表</button>
      </div>
    </div>
  </div>

  <!-- 删除列模态框 -->
  <div class="modal-overlay" id="deleteColumnModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>删除列</h3>
        <button class="close-btn" id="closeDeleteModal">&times;</button>
      </div>
      <div class="modal-body">
        <p>选择要删除的列（主键列不可删除）：</p>
        <div class="column-select-list" id="columnSelectList"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelDeleteBtn">取消</button>
        <button class="btn-primary" id="confirmDeleteColumnBtn">确认删除</button>
      </div>
    </div>
  </div>

  <!-- 添加列模态框 -->
  <div class="modal-overlay" id="addColumnModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>添加新列</h3>
        <button class="close-btn" id="closeAddModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="newColumnName">列名</label>
          <input type="text" id="newColumnName" placeholder="请输入列名">
        </div>
        <div class="form-group">
          <label for="newColumnType">数据类型</label>
          <select id="newColumnType">
            <option value="TEXT">TEXT (文本)</option>
            <option value="INTEGER">INTEGER (整数)</option>
            <option value="REAL">REAL (实数)</option>
            <option value="BLOB">BLOB (二进制)</option>
            <option value="NUMERIC">NUMERIC (数值)</option>
          </select>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="newColumnNotNull"> NOT NULL (不能为空)
          </label>
        </div>
        <div class="form-group">
          <label for="newColumnDefault">默认值（可选）</label>
          <input type="text" id="newColumnDefault" placeholder="请输入默认值">
        </div>
        <p style="color: #666; font-size: 14px;">
          注意：SQLite不支持在已有表中添加主键列，因此无法将新列设置为主键。
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelAddBtn">取消</button>
        <button class="btn-primary" id="confirmAddColumnBtn">确认添加</button>
      </div>
    </div>
  </div>

  <!-- 添加行模态框 -->
  <div class="modal-overlay" id="addRowModal">
    <div class="modal-content" style="max-width: 700px;">
      <div class="modal-header">
        <h3>添加新行</h3>
        <button class="close-btn" id="closeAddRowModal">&times;</button>
      </div>
      <div class="modal-body" style="max-height: 60vh; overflow-y: auto;">
        <div id="rowInputFields"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelAddRowBtn">取消</button>
        <button class="btn-primary" id="confirmAddRowBtn">确认添加</button>
      </div>
    </div>
  </div>

  <script>
    let SQL; // SQL.js实例
    let currentDB; // 当前加载的数据库
    let currentTableName; // 当前查看的表名
    let currentTableColumns = []; // 当前表的列名
    let primaryKeyInfo = { name: '' }; // 主键信息
    let sqlEditor; // CodeMirror编辑器实例

    // 初始化SQL.js
    initSqlJs({
      locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`,
      noFS: true
    }).then(sql => {
      SQL = sql;
      console.log("SQL.js初始化成功");
    }).catch(err => {
      alert(`SQL.js加载失败：${err.message}\n请检查网络或禁用浏览器的跟踪保护`);
      console.error("SQL.js初始化错误：", err);
    });

    // 初始化CodeMirror编辑器
    document.addEventListener('DOMContentLoaded', () => {
      sqlEditor = CodeMirror.fromTextArea(document.getElementById('sqlInput'), {
        mode: 'text/x-sql',
        theme: 'dracula',
        lineNumbers: true,
        indentUnit: 2,
        tabSize: 2,
        indentWithTabs: false,
        lineWrapping: true,
        matchBrackets: true,
        autoCloseBrackets: true,
        extraKeys: {
          'Ctrl-Enter': function() {
            document.getElementById('executeSqlBtn').click();
          },
          'Cmd-Enter': function() {
            document.getElementById('executeSqlBtn').click();
          }
        }
      });
    });

    // 拖放事件处理
    const dropArea = document.getElementById('dropArea');
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
      dropArea.addEventListener(evt, preventDefaults, false);
    });
    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }
    dropArea.addEventListener('dragenter', () => dropArea.classList.add('highlight'));
    dropArea.addEventListener('dragleave', () => dropArea.classList.remove('highlight'));
    dropArea.addEventListener('drop', handleDrop);

    // 处理文件拖放
    function handleDrop(e) {
      dropArea.classList.remove('highlight');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        if (!SQL) {
          alert("SQL.js尚未加载完成，请稍等或刷新页面重试");
          return;
        }
        loadSQLiteFile(files[0]);
      }
    }

    // 处理点击选择文件
    const fileInput = document.getElementById('fileInput');
    fileInput.addEventListener('change', function() {
      if (this.files.length > 0) {
        if (!SQL) {
          alert("SQL.js尚未加载完成，请稍等或刷新页面重试");
          return;
        }
        loadSQLiteFile(this.files[0]);
        // 重置输入框，以便可以重复选择同一个文件
        this.value = '';
      }
    });

    // 加载SQLite文件（共用的加载逻辑）
    function loadSQLiteFile(file) {
      // 验证文件类型（可选，但提升用户体验）
      const validExtensions = ['.db', '.sqlite', '.sqlite3'];
      const fileName = file.name.toLowerCase();
      const hasValidExt = validExtensions.some(ext => fileName.endsWith(ext));
      
      if (!hasValidExt) {
        alert(`文件类型不支持！请选择后缀为 ${validExtensions.join('、')} 的SQLite文件`);
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          currentDB = new SQL.Database(new Uint8Array(e.target.result));
          renderTableList();
          document.getElementById('exportBtn').style.display = 'block';
          // 提示文件加载成功
          alert(`成功加载文件：${file.name}`);
        } catch (err) {

      };
      reader.onerror = function(err) {

    // 渲染表数据（手动实现编辑功能）
    function renderTableData(tableName) {

    // 手动绑定单元格编辑事件（替代Tabledit）
    function bindCellEditEvents(table, tableName) {
      // 给所有非复选框列的单元格添加可编辑标识
      $('#dataTable tbody td:not(:first-child)').addClass('editable');

      // 桌面端：双击单元格开始编辑
      $('#dataTable tbody').on('dblclick', 'td.editable', function() {
        startEditCell($(this), tableName);
      });

      // 移动端：触摸事件支持
      let lastTouchTime = 0;
      const touchDelay = 300; // 双击判定时间阈值（毫秒）

      $('#dataTable tbody').on('touchend', 'td.editable', function(e) {
        e.preventDefault(); // 防止触发其他事件
        const cell = $(this);
        const currentTime = new Date().getTime();
        const timeDiff = currentTime - lastTouchTime;

        // 如果两次触摸间隔小于阈值，视为双击
        if (timeDiff < touchDelay && timeDiff > 0) {
          // 如果已经是编辑状态，不重复处理
          if (cell.find('input').length > 0) return;
          startEditCell(cell, tableName);
        }

        lastTouchTime = currentTime;
      });

      // 开始编辑单元格的通用函数
      function startEditCell(cell, tableName) {
        // 如果已经是编辑状态，不重复处理
        if (cell.find('input').length > 0) return;

        const originalValue = cell.text().trim();
        const rowIndex = cell.parent().index(); // 行索引
        const colIndex = cell.index(); // 列索引（包含复选框列）
        const columnName = currentTableColumns[colIndex - 1]; // 当前列名（减1排除复选框列）

        // 创建输入框替换单元格内容
        cell.html(`<input type="text" class="edit-input" value="${originalValue}">`);
        const input = cell.find('input');
        input.focus();

        // 输入框失去焦点时保存修改
        input.on('blur', function() {
          saveCellEdit(cell, originalValue, rowIndex, colIndex, tableName);
        });

        // 按回车键保存修改
        input.on('keydown', function(e) {
          if (e.key === 'Enter') {
            saveCellEdit(cell, originalValue, rowIndex, colIndex, tableName);
          }
        });
      }
    }

    // 保存单元格修改并执行SQL更新
    function saveCellEdit(cell, originalValue, rowIndex, colIndex, tableName) {
      const input = cell.find('input');
      const newValue = input.val().trim();

      // 如果值没变化，直接恢复显示
      if (newValue === originalValue) {
        cell.text(originalValue);
        return;
      }

      try {
        // 获取当前行数据
        const rowData = $('#dataTable').DataTable().row(rowIndex).data();
        // 获取主键值
        const primaryKeyValue = rowData[primaryKeyInfo.name];
        // colIndex包含了复选框列，需要减1来匹配currentTableColumns数组
        const columnName = currentTableColumns[colIndex - 1];

        // 执行UPDATE SQL命令修改数据库（核心：手动执行更新）
        currentDB.run(`
          UPDATE ${tableName}
          SET ${columnName} = ?
          WHERE ${primaryKeyInfo.name} = ?
        `, [newValue, primaryKeyValue]);

        // 更新单元格显示
        cell.text(newValue);
        alert(`数据更新成功！\n列名：${columnName}\n原值：${originalValue}\n新值：${newValue}`);

      } catch (err) {
        // 出错时恢复原值
        cell.text(originalValue);
        alert(`更新数据失败：${err.message}`);
        console.error("数据更新错误：", err);
      }
    }

    // 获取表的主键信息
    function getPrimaryKeyInfo(tableName) {
      try {
        const tableInfo = currentDB.exec(`PRAGMA table_info(${tableName})`)[0];
        if (!tableInfo) return { name: '' };

        for (let i = 0; i < tableInfo.values.length; i++) {
          if (tableInfo.values[i][5] === 1) { // pk字段为1表示主键
            return {
              name: tableInfo.values[i][1] // 主键名
            };
          }
        }

        alert(`警告：表【${tableName}】无主键，无法编辑数据！`);
        return { name: '' };

      } catch (err) {
        alert(`获取主键信息失败：${err.message}`);
        console.error("主键查询错误：", err);
        return { name: '' };
      }
    }

    // 删除列函数（通过重新创建表实现）
    function deleteColumns(tableName, columnsToDelete) {
      try {
        // 获取表的完整结构信息
        const tableInfo = currentDB.exec(`PRAGMA table_info(${tableName})`)[0];

        // 获取要保留的列信息
        const columnsToKeep = tableInfo.values.filter(col => !columnsToDelete.includes(col[1]));

        if (columnsToKeep.length === 0) {
          alert('不能删除所有列！');
          return;
        }

        // 生成临时表名
        const tempTableName = `temp_${tableName}_${Date.now()}`;

        // 构建临时表的列定义
        const columnDefs = columnsToKeep.map(col => {
          let def = `${col[1]} ${col[2]}`;
          if (col[5] === 1) { // 是主键
            def += ' PRIMARY KEY';
          }
          if (col[3] === 1) { // NOT NULL
            def += ' NOT NULL';
          }
          if (col[4]) { // 默认值
            def += ` DEFAULT ${col[4]}`;
          }
          return def;
        });

        // 创建临时表
        currentDB.run(`CREATE TABLE ${tempTableName} (${columnDefs.join(', ')})`);

        // 复制数据到临时表
        const columnsToKeepNames = columnsToKeep.map(col => col[1]);
        currentDB.run(`
          INSERT INTO ${tempTableName} (${columnsToKeepNames.join(', ')})
          SELECT ${columnsToKeepNames.join(', ')} FROM ${tableName}
        `);

        // 删除原表
        currentDB.run(`DROP TABLE ${tableName}`);

        // 重命名临时表为原表名
        currentDB.run(`ALTER TABLE ${tempTableName} RENAME TO ${tableName}`);

        // 获取索引信息并重建索引
        const indexes = currentDB.exec(`
          SELECT sql FROM sqlite_master
          WHERE type='index' AND tbl_name='${tableName}' AND sql IS NOT NULL
        `);

        if (indexes && indexes.length > 0) {
          indexes[0].values.forEach(([indexSql]) => {
            try {
              currentDB.run(indexSql);
            } catch (err) {
              console.warn(`重建索引失败：${err.message}`);
            }
          });
        }

        alert(`成功删除 ${columnsToDelete.length} 个列！`);
        document.getElementById('deleteColumnModal').style.display = 'none';
        renderTableList();

        // 重新加载当前表数据
        primaryKeyInfo = getPrimaryKeyInfo(tableName);
        renderTableData(tableName);

      } catch (err) {
        alert(`删除列失败：${err.message}`);
        console.error("删除列错误：", err);
      }
    }

      const columnName = document.getElementById('newColumnName').value.trim();
      const columnType = document.getElementById('newColumnType').value;
      const notNull = document.getElementById('newColumnNotNull').checked;
      const defaultValue = document.getElementById('newColumnDefault').value.trim();

      // 验证列名
      if (!columnName) {
        alert('请输入列名');
        return;
      }

      // 检查列名是否已存在
      try {
        const tableInfo = currentDB.exec(`PRAGMA table_info(${currentTableName})`)[0];
        const existingColumns = tableInfo.values.map(col => col[1]);

        if (existingColumns.includes(columnName)) {
          alert('列名已存在，请使用其他列名');
          return;
        }
      } catch (err) {
        console.error("检查列名错误：", err);
      }

      // 构建ALTER TABLE SQL
      let sql = `ALTER TABLE ${currentTableName} ADD COLUMN ${columnName} ${columnType}`;

      if (notNull) {
        sql += ' NOT NULL';
      }

      if (defaultValue) {
        // 根据数据类型处理默认值
        if (columnType === 'TEXT') {
          sql += ` DEFAULT '${defaultValue.replace(/'/g, "''")}'`;
        } else if (columnType === 'INTEGER' || columnType === 'REAL' || columnType === 'NUMERIC') {
          sql += ` DEFAULT ${defaultValue}`;
        } else {
          sql += ` DEFAULT ${defaultValue}`;
        }
      }

      try {
        currentDB.run(sql);
        alert(`列【${columnName}】添加成功！`);
        document.getElementById('addColumnModal').style.display = 'none';

        // 重新加载当前表数据
        primaryKeyInfo = getPrimaryKeyInfo(currentTableName);

    // 渲染列定义列表
    function renderColumnList() {
      const columnListEl = document.getElementById('columnList');
      columnListEl.innerHTML = '';

      columnDefinitions.forEach((col, index) => {
        const colDiv = document.createElement('div');
        colDiv.className = 'column-definition';

        const row = document.createElement('div');
        row.className = 'column-row';

        // 列名输入框
        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.placeholder = '列名';
        nameInput.value = col.name;
        nameInput.addEventListener('input', (e) => {
          columnDefinitions[index].name = e.target.value;
        });

        // 类型选择框
        const typeSelect = document.createElement('select');
        const types = ['INTEGER', 'TEXT', 'REAL', 'BLOB', 'NUMERIC'];
        types.forEach(type => {
          const option = document.createElement('option');
          option.value = type;
          option.textContent = type;
          if (type === col.type) option.selected = true;
          typeSelect.appendChild(option);
        });
        typeSelect.addEventListener('change', (e) => {
          columnDefinitions[index].type = e.target.value;
        });

        // 主键复选框
        const pkLabel = document.createElement('label');
        pkLabel.style.display = 'flex';
        pkLabel.style.alignItems = 'center';
        pkLabel.style.gap = '5px';
        const pkCheckbox = document.createElement('input');
        pkCheckbox.type = 'checkbox';
        pkCheckbox.checked = col.isPrimaryKey;
        pkCheckbox.addEventListener('change', (e) => {
          // 如果选中某列为主键，取消其他列的主键状态
          if (e.target.checked) {
            columnDefinitions.forEach((c, i) => {
              if (i !== index) c.isPrimaryKey = false;
            });
          }
          columnDefinitions[index].isPrimaryKey = e.target.checked;
          renderColumnList();
        });
        pkLabel.appendChild(pkCheckbox);
        pkLabel.appendChild(document.createTextNode('主键'));

        // 删除列按钮
        const deleteColBtn = document.createElement('button');
        deleteColBtn.className = 'btn-small';
        deleteColBtn.textContent = '删除';
        deleteColBtn.addEventListener('click', () => {
          columnDefinitions.splice(index, 1);
          renderColumnList();
        });

        row.appendChild(nameInput);
        row.appendChild(typeSelect);
        row.appendChild(pkLabel);
        colDiv.appendChild(row);
        colDiv.appendChild(deleteColBtn);
        columnListEl.appendChild(colDiv);
      });
    }

    // 创建表
    document.getElementById('saveTableBtn').addEventListener('click', () => {
      const tableName = document.getElementById('tableName').value.trim();

      // 验证表名
      if (!tableName) {
        alert('请输入表名');
        return;
      }

      // 检查表名是否已存在
      try {
        const existingTables = currentDB.exec(`
          SELECT name FROM sqlite_master
          WHERE type='table' AND name = ?
        `, [tableName]);
        if (existingTables && existingTables.length > 0) {
          alert('表名已存在，请使用其他表名');
          return;
        }
      } catch (err) {
        console.error("表名检查错误：", err);
      }

      // 验证列定义
      if (columnDefinitions.length === 0) {
        alert('请至少添加一列');
        return;
      }

      const invalidCol = columnDefinitions.find(col => !col.name.trim());
      if (invalidCol) {
        alert('请为所有列填写列名');
        return;
      }

      // 检查是否有主键
      const hasPrimaryKey = columnDefinitions.some(col => col.isPrimaryKey);
      if (!hasPrimaryKey) {
        alert('警告：表没有主键，将无法编辑数据！是否继续？');
      }

      // 构建CREATE TABLE SQL
      const columnDefs = columnDefinitions.map(col => {
        let def = `${col.name} ${col.type}`;
        if (col.isPrimaryKey) {
          def += ' PRIMARY KEY';
        }
        return def;
      });

      const sql = `CREATE TABLE ${tableName} (${columnDefs.join(', ')})`;

      try {
        currentDB.run(sql);
        alert(`表【${tableName}】创建成功！`);
        closeModal();
        renderTableList();
        // 自动打开新创建的表
        currentTableName = tableName;
        primaryKeyInfo = getPrimaryKeyInfo(tableName);
        renderTableData(tableName);
      } catch (err) {
        alert(`创建表失败：${err.message}`);
        console.error("创建表错误：", err);
      }
    });

    // 删除表
    function deleteTable(tableName) {
      try {
        currentDB.run(`DROP TABLE ${tableName}`);
        alert(`表【${tableName}】已删除`);
        renderTableList();
        // 如果删除的是当前显示的表，清空表格并隐藏列管理按钮
        if (currentTableName === tableName) {
          if ($.fn.dataTable.isDataTable('#dataTable')) {
            $('#dataTable').DataTable().destroy();
          }
          $('#dataTable').empty();
          currentTableName = null;
          currentTableColumns = [];
          // 隐藏列管理和行管理按钮
          document.getElementById('deleteColumnBtn').style.display = 'none';
          document.getElementById('addColumnBtn').style.display = 'none';
          document.getElementById('addRowBtn').style.display = 'none';
          document.getElementById('deleteRowBtn').style.display = 'none';
        }
      } catch (err) {
        alert(`删除表失败：${err.message}`);
        console.error("删除表错误：", err);
      }
    }

    // ========== SQL执行区域功能 ==========

    // 切换SQL执行区域显示/隐藏
    document.getElementById('sqlExecHeader').addEventListener('click', () => {
      const header = document.getElementById('sqlExecHeader');
      const content = document.getElementById('sqlExecContent');

      header.classList.toggle('collapsed');
      content.classList.toggle('hidden');
    });

    // 执行SQL按钮
    document.getElementById('executeSqlBtn').addEventListener('click', () => {
      if (!SQL) {
        showSqlMessage('SQL.js尚未加载完成，请稍等或刷新页面重试', 'error');
        return;
      }
      // 如果没有数据库，自动创建一个新的空数据库
      if (!currentDB) {
        try {
          currentDB = new SQL.Database();
          renderTableList();
          document.getElementById('exportBtn').style.display = 'block';
          showSqlMessage('已自动创建新数据库', 'info');
        } catch (err) {
          showSqlMessage(`创建数据库失败：${err.message}`, 'error');
          return;
        }
      }

      const sql = sqlEditor.getValue().trim();
      if (!sql) {
        showSqlMessage('请输入SQL语句！', 'error');
        return;
      }

      executeSQL(sql);
    });

    // 清空按钮
    document.getElementById('clearSqlBtn').addEventListener('click', () => {
      sqlEditor.setValue('');
      document.getElementById('sqlResultTable').innerHTML = '';
      document.getElementById('sqlMessage').innerHTML = '';
    });

    // 执行SQL语句
    function executeSQL(sql) {
      try {
        // 显示执行中提示
        showSqlMessage('正在执行SQL...', 'info');

        // 执行SQL
        const results = currentDB.exec(sql);

        // 清空之前的消息
        document.getElementById('sqlMessage').innerHTML = '';

        if (results.length === 0) {
          // 没有结果集，可能是INSERT/UPDATE/DELETE等操作
          showSqlMessage('SQL执行成功（无返回结果）', 'success');
          // 刷新表列表（因为表可能被修改）
          renderTableList();
          // 如果当前表有数据，也刷新
          if (currentTableName) {
            primaryKeyInfo = getPrimaryKeyInfo(currentTableName);
            renderTableData(currentTableName);
          }
        } else {
          // 有结果集，显示表格
          renderSqlResults(results);
          showSqlMessage(`查询成功！返回 ${results.length} 个结果集`, 'success');
        }

      } catch (err) {
        showSqlMessage(`SQL执行失败：${err.message}`, 'error');
        console.error("SQL执行错误：", err);
      }
    }

    // 渲染SQL查询结果
    function renderSqlResults(results) {
      const resultTableDiv = document.getElementById('sqlResultTable');
      resultTableDiv.innerHTML = '';

      results.forEach((result, index) => {
        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const tbody = document.createElement('tbody');

        // 表头
        const headerRow = document.createElement('tr');
        result.columns.forEach(col => {
          const th = document.createElement('th');
          th.textContent = col;
          headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        table.appendChild(thead);

        // 表体数据
        if (result.values && result.values.length > 0) {
          result.values.forEach(row => {
            const tr = document.createElement('tr');
            row.forEach(cell => {
              const td = document.createElement('td');
              td.textContent = cell !== null ? cell : 'NULL';
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
        } else {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = result.columns.length;
          td.textContent = '无数据';
          td.style.textAlign = 'center';
          td.style.color = '#999';
          tr.appendChild(td);
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);

        // 添加结果集标题
        const resultTitle = document.createElement('div');
        resultTitle.className = 'sql-stats';
        resultTitle.textContent = `结果集 ${index + 1}：${result.values.length} 行，${result.columns.length} 列`;
        resultTableDiv.appendChild(resultTitle);
        resultTableDiv.appendChild(table);
        resultTableDiv.appendChild(document.createElement('br'));
      });
    }

    // 显示SQL执行消息
    function showSqlMessage(message, type = 'info') {
      const messageDiv = document.getElementById('sqlMessage');
      messageDiv.className = 'sql-message ' + type;
      messageDiv.textContent = message;
    }

    // ========== 添加行和删除行功能 ==========

    // 更新删除行按钮状态
    function updateDeleteRowButtonState() {
      const checkedCount = $('.row-checkbox:checked').length;
      const deleteBtn = document.getElementById('deleteRowBtn');
      if (deleteBtn) {
        deleteBtn.disabled = checkedCount === 0;
        deleteBtn.style.opacity = checkedCount === 0 ? '0.5' : '1';
        deleteBtn.style.cursor = checkedCount === 0 ? 'not-allowed' : 'pointer';
      }
    }

    // 打开添加行模态框
    document.getElementById('addRowBtn').addEventListener('click', () => {
      if (!currentDB) {
        alert("请先加载SQLite文件");
        return;
      }
      if (!currentTableName) {
        alert("请先选择一个表");
        return;
      }

      try {
        // 获取表的列信息
        const tableInfo = currentDB.exec(`PRAGMA table_info(${currentTableName})`)[0];
        if (!tableInfo) {
          alert("无法获取表结构信息");
          return;
        }

        const pkInfo = getPrimaryKeyInfo(currentTableName);

        // 渲染输入字段
        const inputFieldsDiv = document.getElementById('rowInputFields');
        inputFieldsDiv.innerHTML = '';

        tableInfo.values.forEach((col, index) => {
          const colName = col[1];
          const colType = col[2];
          const notNull = col[3] === 1;
          const defaultValue = col[4];
          const isPk = colName === pkInfo.name;

          const formGroup = document.createElement('div');
          formGroup.className = 'form-group';

          let labelText = colName;
          if (isPk) labelText += ' <span class="row-data-label-pk">(主键)</span>';
          if (notNull) labelText += ' <span class="row-data-label-notnull">*</span>';
          labelText += ` <span style="color: #999; font-size: 12px;">${colType}</span>`;

          const label = document.createElement('label');
          label.className = 'row-data-input-label';
          label.innerHTML = labelText;
          formGroup.appendChild(label);

          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'row-data-input';
          input.id = `row_input_${index}`;
          input.dataset.columnName = colName;
          input.dataset.columnType = colType;
          input.dataset.notNull = notNull;

          // 如果是主键且是INTEGER类型，说明可能是自增，留空即可
          if (isPk && colType === 'INTEGER') {
            input.placeholder = '留空自动生成';
          } else if (defaultValue) {
            input.placeholder = `默认值: ${defaultValue}`;
          } else {
            input.placeholder = '请输入值';
          }

          formGroup.appendChild(input);
          inputFieldsDiv.appendChild(formGroup);
        });

        document.getElementById('addRowModal').style.display = 'flex';
      } catch (err) {
        alert(`获取表结构失败：${err.message}`);
        console.error("表结构查询错误：", err);
      }
    });

    // 关闭添加行模态框
    document.getElementById('closeAddRowModal').addEventListener('click', () => {
      document.getElementById('addRowModal').style.display = 'none';
    });
    document.getElementById('cancelAddRowBtn').addEventListener('click', () => {
      document.getElementById('addRowModal').style.display = 'none';
    });

    // 确认添加行
    document.getElementById('confirmAddRowBtn').addEventListener('click', () => {
      try {
        // 获取表的列信息
        const tableInfo = currentDB.exec(`PRAGMA table_info(${currentTableName})`)[0];
        const pkInfo = getPrimaryKeyInfo(currentTableName);

        const columns = [];
        const values = [];
        const placeholders = [];

        // 收集用户输入的值
        let hasEmptyRequired = false;
        const emptyFields = [];

        tableInfo.values.forEach((col, index) => {
          const colName = col[1];
          const colType = col[2];
          const notNull = col[3] === 1;
          const defaultValue = col[4];
          const isPk = colName === pkInfo.name;

          const input = document.getElementById(`row_input_${index}`);
          let value = input.value.trim();

          // 检查必填字段
          if (notNull && !value && !defaultValue && !(isPk && colType === 'INTEGER')) {
            hasEmptyRequired = true;
            emptyFields.push(colName);
            return;
          }

          // 如果是自增主键且没有提供值，跳过
          if (isPk && colType === 'INTEGER' && !value) {
            return;
          }

          // 使用用户输入的值或默认值
          if (!value && defaultValue) {
            value = defaultValue;
          }

          columns.push(colName);
          placeholders.push('?');
          values.push(value);
        });

        if (hasEmptyRequired) {
          alert(`以下必填字段不能为空：\n${emptyFields.join('\n')}`);
          return;
        }

        if (columns.length === 0) {
          alert('请至少填写一个非自增字段的值');
          return;
        }

        // 构建INSERT SQL
        const sql = `INSERT INTO ${currentTableName} (${columns.join(', ')}) VALUES (${placeholders.join(', ')})`;

        // 执行INSERT
        currentDB.run(sql, values);

        alert('添加行成功！');
        document.getElementById('addRowModal').style.display = 'none';

        // 重新加载表数据
        primaryKeyInfo = getPrimaryKeyInfo(currentTableName);
        renderTableData(currentTableName);

      } catch (err) {
        alert(`添加行失败：${err.message}`);
        console.error("添加行错误：", err);
      }
    });

    // 删除选中行
    document.getElementById('deleteRowBtn').addEventListener('click', () => {
      if (!currentDB) {
        alert("请先加载SQLite文件");
        return;
      }
      if (!currentTableName) {
        alert("请先选择一个表");
        return;
      }

      // 检查是否有选中的行
      const checkedCheckboxes = $('.row-checkbox:checked');
      if (checkedCheckboxes.length === 0) {
        alert('请先选择要删除的行');
        return;
      }

      // 获取主键信息
      if (!primaryKeyInfo.name) {
        alert('表没有主键，无法删除行！');
        return;
      }

      // 确认删除
      if (!confirm(`确定要删除选中的 ${checkedCheckboxes.length} 行吗？此操作不可恢复！`)) {
        return;
      }

      try {
        const table = $('#dataTable').DataTable();
        let deletedCount = 0;
        let failedCount = 0;

        checkedCheckboxes.each(function() {
          const row = $(this).closest('tr');
          const rowIndex = table.row(row).index();
          const rowData = table.row(rowIndex).data();

          // 获取主键值
          const primaryKeyValue = rowData[primaryKeyInfo.name];

          try {
            // 执行DELETE语句
            currentDB.run(`
              DELETE FROM ${currentTableName}
              WHERE ${primaryKeyInfo.name} = ?
            `, [primaryKeyValue]);
            deletedCount++;
          } catch (err) {
            console.error(`删除行失败（主键值: ${primaryKeyValue}）:`, err);
            failedCount++;
          }
        });

        if (failedCount > 0) {
          alert(`删除完成！成功删除 ${deletedCount} 行，失败 ${failedCount} 行。`);
        } else {
          alert(`成功删除 ${deletedCount} 行！`);
        }

        // 重新加载表数据
        primaryKeyInfo = getPrimaryKeyInfo(currentTableName);
        renderTableData(currentTableName);

      } catch (err) {
        alert(`删除行失败：${err.message}`);
        console.error("删除行错误：", err);
      }
    });
  </script>
</body>
</html>
